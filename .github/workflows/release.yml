name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Runs when a tag like v1.0.0 is pushed

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # Match your Python version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Update version in __init__.py
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          tag_name = os.environ["GITHUB_REF"].split("/")[-1]
          version = tag_name[1:] if tag_name.startswith("v") else tag_name
          version = version[1:] if version.startswith(".") else version
          init_path = pathlib.Path("markitdowngui/__init__.py")
          content = init_path.read_text(encoding="utf-8")
          updated = re.sub(r'__version__\s*=\s*".*?"', f'__version__ = "{version}"', content)
          init_path.write_text(updated, encoding="utf-8")
          print(init_path.read_text(encoding="utf-8"))
          PY
        shell: bash

      - name: Build executable
        run: uv run pyinstaller MarkItDown.spec --clean --noconfirm
        shell: bash

      - name: Package artifact
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          VERSION="${VERSION#.}"
          mkdir -p dist_output
          if [ "${{ runner.os }}" = "macOS" ]; then
            hdiutil create -volname "MarkItDown" -srcfolder "dist/MarkItDown" -ov -format UDZO "dist_output/MarkItDown-macOS-${VERSION}.dmg"
          else
            ARTIFACT_NAME="MarkItDown-${{ runner.os }}-${VERSION}.zip"
            cd dist
            python -m zipfile -c "../dist_output/${ARTIFACT_NAME}" MarkItDown
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarkItDown-${{ runner.os }}
          path: dist_output/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          assets = []
          for path in sorted(
              candidate
              for pattern in ("**/*.zip", "**/*.dmg")
              for candidate in Path("artifacts").glob(pattern)
          ):
              name = path.name
              platform = ""
              if "-Windows-" in name:
                  platform = "Windows"
              elif "-macOS-" in name:
                  platform = "macOS"
              elif "-Linux-" in name:
                  platform = "Linux"
              assets.append(
                  {
                      "name": name,
                      "platform": platform,
                      "size": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
              )

          manifest = {
              "schema": 1,
              "tag": "${{ github.ref_name }}",
              "assets": assets,
          }
          output = Path("artifacts/markitdown-release-manifest.json")
          output.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(output.read_text(encoding="utf-8"))
          PY
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/markitdown-release-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
