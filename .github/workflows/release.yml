name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/package-validation-*'
    tags:
      - 'v*'  # Runs when a tag like v1.0.0 is pushed

env:
  UV_PYTHON: '3.10'

permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'  # Match your Python version

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-shape0 libxcb-keysyms1 libxcb-icccm4 xvfb xauth

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed: $LASTEXITCODE" }

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Set build version
        run: |
          uv run --locked python - <<'PY'
          import importlib.metadata
          import os
          import pathlib
          import re
          from packaging.version import Version

          ref = os.environ["GITHUB_REF"]
          if os.environ["GITHUB_EVENT_NAME"] == "push" and ref.startswith("refs/tags/v"):
              raw_version = ref.removeprefix("refs/tags/v").removeprefix(".")
          else:
              raw_version = importlib.metadata.version("markitdowngui")
          version = str(Version(raw_version))
          if not re.fullmatch(r"[0-9][0-9A-Za-z.+-]*", version):
              raise ValueError(f"Unsafe build version: {version!r}")

          init_path = pathlib.Path("markitdowngui/__init__.py")
          content = init_path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'__version__\s*=\s*".*?"', f'__version__ = "{version}"', content
          )
          if count != 1:
              raise ValueError("Expected exactly one package __version__ assignment")
          init_path.write_text(updated, encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"BUILD_VERSION={version}\n")
          print(f"Build version: {version}")
          PY
        shell: bash

      - name: Run tests
        run: uv run --locked pytest -q
        shell: bash

      - name: Build executable
        run: uv run --locked pyinstaller MarkItDown.spec --clean --noconfirm
        shell: bash

      - name: Run packaged-app smoke test
        run: uv run --locked python packaging/smoke_packaged_app.py --check-backends --report package-check-reports/dist-backends.json
        shell: bash

      - name: Package artifact
        run: |
          mkdir -p dist_output
          if [ "${{ runner.os }}" = "macOS" ]; then
            APP_PATH="dist/MarkItDown.app"
            if [ ! -d "$APP_PATH" ]; then
              echo "Expected macOS app bundle at $APP_PATH" >&2
              exit 1
            fi
            SIGN_IDENTITY="${MACOS_CODESIGN_IDENTITY:--}"
            if [ "$SIGN_IDENTITY" = "-" ]; then
              codesign --force --deep --timestamp=none --sign "$SIGN_IDENTITY" "$APP_PATH"
            else
              codesign --force --deep --timestamp --sign "$SIGN_IDENTITY" "$APP_PATH"
            fi
            mkdir -p dmg_root
            cp -R "$APP_PATH" dmg_root/
            ln -s /Applications dmg_root/Applications
            hdiutil create -volname "MarkItDown" -srcfolder dmg_root -ov -format UDZO "dist_output/MarkItDown-macOS-${BUILD_VERSION}.dmg"
          else
            ARTIFACT_NAME="MarkItDown-${{ runner.os }}-${BUILD_VERSION}.zip"
            cd dist
            python -m zipfile -c "../dist_output/${ARTIFACT_NAME}" MarkItDown
          fi
        shell: bash
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $iscc = Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler not found at $iscc"
          }
          $sourceDir = (Resolve-Path -LiteralPath 'dist\MarkItDown').Path
          $outputDir = (Resolve-Path -LiteralPath 'dist_output').Path
          & $iscc 'packaging\windows\MarkItDown.iss' "/DAppVersion=$env:BUILD_VERSION" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir"
          if ($LASTEXITCODE -ne 0) { throw "Windows installer build failed: $LASTEXITCODE" }

      - name: Check installed Windows app
        if: runner.os == 'Windows'
        run: |
          $installer = Join-Path (Resolve-Path 'dist_output').Path "MarkItDown-Windows-Setup-$env:BUILD_VERSION.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'MarkItDown-installed'
          $reportDir = New-Item -ItemType Directory -Force 'package-check-reports'
          $installLog = Join-Path $reportDir.FullName 'windows-installer.log'
          $process = Start-Process -FilePath $installer -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-',
            "/DIR=`"$installDir`"", "/LOG=`"$installLog`""
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Windows installer failed: $($process.ExitCode)" }
          $installedApp = Join-Path $installDir 'MarkItDown.exe'
          if (-not (Test-Path -LiteralPath $installedApp -PathType Leaf)) {
            throw "Installed app not found: $installedApp"
          }
          uv run --locked python packaging/smoke_packaged_app.py --check-backends --executable $installedApp --report package-check-reports/windows-installed-backends.json
          if ($LASTEXITCODE -ne 0) { throw "Installed Windows app check failed: $LASTEXITCODE" }

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: |
          APPDIR="MarkItDown.AppDir"
          APPIMAGE_TOOL_URL="https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"

          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/lib/markitdown"
          cp -a dist/MarkItDown/. "$APPDIR/usr/lib/markitdown/"
          cp markitdowngui/resources/markitdown-gui.png "$APPDIR/markitdown-gui.png"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/lib/markitdown/MarkItDown" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/MarkItDown.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MarkItDown
          Exec=AppRun
          Icon=markitdown-gui
          Categories=Office;Utility;
          Terminal=false
          EOF

          curl --fail --location "$APPIMAGE_TOOL_URL" -o appimagetool.AppImage
          chmod +x appimagetool.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool.AppImage "$APPDIR" "dist_output/MarkItDown-Linux-${BUILD_VERSION}.AppImage"
          chmod +x "dist_output/MarkItDown-Linux-${BUILD_VERSION}.AppImage"
        shell: bash

      - name: Check extracted Linux AppImage
        if: runner.os == 'Linux'
        run: |
          appimage="$GITHUB_WORKSPACE/dist_output/MarkItDown-Linux-${BUILD_VERSION}.AppImage"
          extract_dir="$(mktemp -d "$RUNNER_TEMP/markitdown-appimage-XXXXXX")"
          mkdir -p package-check-reports
          (
            cd "$extract_dir"
            "$appimage" --appimage-extract > "$GITHUB_WORKSPACE/package-check-reports/linux-appimage-extract.log"
          )
          xvfb-run -a uv run --locked python packaging/smoke_packaged_app.py --check-backends --qt-platform xcb --executable "$extract_dir/squashfs-root/AppRun" --report package-check-reports/linux-appimage-backends.json
        shell: bash

      - name: Upload package check reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MarkItDown-package-checks-${{ runner.os }}
          path: package-check-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: MarkItDown-${{ runner.os }}
          path: dist_output/*
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download built artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate release manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          assets = []
          for path in sorted(
              candidate
              for pattern in ("**/*.zip", "**/*.dmg", "**/*.exe", "**/*.AppImage")
              for candidate in Path("artifacts").glob(pattern)
          ):
              name = path.name
              platform = ""
              if "-Windows-" in name:
                  platform = "Windows"
              elif "-macOS-" in name:
                  platform = "macOS"
              elif "-Linux-" in name:
                  platform = "Linux"
              assets.append(
                  {
                      "name": name,
                      "platform": platform,
                      "size": path.stat().st_size,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  }
              )

          manifest = {
              "schema": 1,
              "tag": "${{ github.ref_name }}",
              "assets": assets,
          }
          output = Path("artifacts/markitdown-release-manifest.json")
          output.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(output.read_text(encoding="utf-8"))
          PY
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*.AppImage
            artifacts/markitdown-release-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}
